[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-racing-championship"
version = "0.0.0"
description = "A planned 2D racing game for the Design and Analysis of Algorithms course."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pygame>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "matplotlib>=3.9,<4"]
packaging = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["smart_racing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
