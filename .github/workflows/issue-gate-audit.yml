name: Issue Gate Audit

on:
  issues:
    types: [closed, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: issue-gate-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Issue Gate Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Report invalid closed gates for human correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_phase_gates --audit
