name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run tests when test files exist
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem tests -Recurse -Filter "test_*.py" -File -ErrorAction SilentlyContinue
          if ($testFiles) {
            python -m pytest
          } else {
            Write-Host "No test files yet; skipping pytest until project functionality is implemented."
          }
