name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,report]" "pymupdf>=1.24,<2"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Lint Python
        run: python -m ruff check src tests experiments scripts
      - name: Run tests
        run: python -m pytest
      - name: Render interface previews
        run: python scripts/capture_previews.py
      - name: Upload interface previews
        uses: actions/upload-artifact@v7
        with:
          name: interface-previews
          path: output/previews/*.png
          if-no-files-found: error
      - name: Build and render technical report
        run: |
          python scripts/build_report.py
          python scripts/render_report_preview.py
      - name: Upload report for inspection
        uses: actions/upload-artifact@v7
        with:
          name: report-verification
          path: |
            output/pdf/technical-report.pdf
            output/report-review/*.png
          if-no-files-found: error

  package-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[packaging,report]"
      - name: Build Windows executable
        shell: pwsh
        run: .\scripts\build.ps1
      - name: Build report for test archive
        run: .\.venv\Scripts\python.exe scripts\build_report.py
      - name: Run built and extracted executable smoke tests
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          function Invoke-ApplicationSmoke([string] $executable) {
            $process = Start-Process -FilePath $executable -ArgumentList "--smoke-test" -WindowStyle Hidden -PassThru -WorkingDirectory (Split-Path -Parent $executable)
            if (-not $process.WaitForExit(60000)) {
              $process.Kill()
              throw "Packaged application smoke test timed out."
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              throw "Packaged application smoke test exited with code $($process.ExitCode)."
            }
          }
          $executable = Join-Path $PWD "dist/SmartRacingChampionship.exe"
          Invoke-ApplicationSmoke $executable
          $archivePath = Join-Path $env:RUNNER_TEMP "executable-smoke.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "executable-smoke-extracted"
          Compress-Archive -LiteralPath $executable -DestinationPath $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractDir
          Invoke-ApplicationSmoke (Join-Path $extractDir "SmartRacingChampionship.exe")
          .\.venv\Scripts\python.exe scripts\package_submission.py --registration TEST-1 --section TEST-SECTION
          if ($LASTEXITCODE -ne 0) { throw "Test submission archive creation failed." }
          $submissionArchive = Join-Path $PWD "dist/TEST-1_TEST-SECTION.zip"
          $submissionExtract = Join-Path $env:RUNNER_TEMP "submission-test-extracted"
          Expand-Archive -LiteralPath $submissionArchive -DestinationPath $submissionExtract
          $requiredFiles = @(
            "SmartRacingChampionship.exe", "technical-report.pdf", "source/README.md",
            "source/pyproject.toml", "source/src/smart_racing/__main__.py",
            "source/data/circuits/circuit_1.json", "source/data/circuits/circuit_2.json",
            "source/data/circuits/circuit_3.json", "source/assets/fonts/OFL.txt", "source/assets/fonts/Barlow-Regular.ttf",
            "source/assets/fonts/BarlowCondensed-BoldItalic.ttf", "source/assets/fonts/BarlowCondensed-SemiBold.ttf",
            "source/assets/images/pit-lane-night.png",
            "source/assets/images/neon-harbor-night.png", "source/assets/images/copper-canyon-dusk.png",
            "source/assets/images/aurora-circuit-dusk.png", "source/assets/audio/README.md",
            "source/assets/audio/menu-ambience.wav", "source/assets/audio/race-ambience.wav",
            "source/assets/audio/race-rev.wav", "source/assets/audio/race-boost.wav",
            "source/assets/audio/focus.wav", "source/assets/audio/confirm.wav",
            "source/assets/audio/transition.wav", "source/assets/audio/countdown.wav",
            "source/assets/audio/launch.wav", "source/assets/audio/nitro.wav",
            "source/assets/audio/checkpoint.wav", "source/assets/audio/warning.wav",
            "source/assets/audio/finish.wav",
            "source/docs/assignment-specification.md", "source/experiments/results/analysis.md",
            "source/experiments/results/studies.json"
          )
          foreach ($relativePath in $requiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $submissionExtract $relativePath) -PathType Leaf)) {
              throw "Test submission archive is missing $relativePath"
            }
          }
          foreach ($pair in @(
            @($executable, (Join-Path $submissionExtract "SmartRacingChampionship.exe")),
            @((Join-Path $PWD "output/pdf/technical-report.pdf"), (Join-Path $submissionExtract "technical-report.pdf"))
          )) {
            if ((Get-FileHash -LiteralPath $pair[0]).Hash -ne (Get-FileHash -LiteralPath $pair[1]).Hash) {
              throw "Extracted test submission file differs from its source."
            }
          }
          Invoke-ApplicationSmoke (Join-Path $submissionExtract "SmartRacingChampionship.exe")
          Write-Host "Built executable, executable-only archive and full test submission archive smoke tests passed."
