name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run tests when test files exist
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem tests -Recurse -Filter "test_*.py" -File -ErrorAction SilentlyContinue
          if ($testFiles) {
            python -m pytest
          } else {
            Write-Host "No test files yet; skipping pytest until project functionality is implemented."
          }
      - name: Render interface previews
        run: python scripts/capture_previews.py
      - name: Upload interface previews
        uses: actions/upload-artifact@v4
        with:
          name: interface-previews
          path: output/previews/*.png
          if-no-files-found: error

  package-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[packaging]"
      - name: Build Windows executable
        shell: pwsh
        run: .\scripts\build.ps1
      - name: Run packaged application smoke test
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $executable = Join-Path $PWD "dist/SmartRacingChampionship.exe"
          $process = Start-Process -FilePath $executable -ArgumentList "--smoke-test" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "Packaged application smoke test timed out."
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            throw "Packaged application smoke test exited with code $($process.ExitCode)."
          }
          Write-Host "Packaged application smoke test passed."
