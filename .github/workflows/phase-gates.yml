name: Phase Governance

on:
  pull_request:
    branches: [main, game, 'feature/**']
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: phase-gates-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  phase-gates:
    name: Phase Gate Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate scope, live issues, dependencies and trusted phase authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_phase_gates
